
services:
  api:
    image: ai-document-rag:latest
    container_name: ai-document-rag-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - rag-chroma-data:/app/chroma_db

  ui:
    build:
      context: ./frontend
    container_name: ai-document-rag-ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

volumes:
  rag-chroma-data:
    external: true
